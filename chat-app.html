<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCA Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#060E1F;
    --navy-2:#0C1A38;
    --navy-3:#132345;
    --blue-1:#1349A0;
    --blue-2:#2B8AE8;
    --ink:#0B1730;
    --muted:#6B7688;
    --line:#E3E7EF;
    --bg:#F5F7FB;
    --online:#3FBE7A;
    --offline:#D64545;
    --away:#E8A93A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;color:var(--ink);}
  #app{display:flex;height:100vh;width:100vw;overflow:hidden;}

  /* Sidebar */
  #sidebar{
    width:280px;flex-shrink:0;
    background:var(--navy);
    color:#fff;
    display:flex;flex-direction:column;
  }
  .side-header{
    padding:20px 18px 14px;
    display:flex;align-items:center;gap:10px;
    border-bottom:1px solid #16234A;
  }
  .side-header .mark{
    width:32px;height:32px;border-radius:8px;
    object-fit:cover;flex-shrink:0;
  }
  .side-header .name{font-family:'Outfit',sans-serif;font-weight:600;font-size:15px;}
  .side-scroll{flex:1;overflow-y:auto;padding:14px 10px;}
  .side-section{
    font-size:11px;font-weight:600;letter-spacing:.5px;
    color:#5C6A8C;text-transform:uppercase;
    padding:14px 10px 6px;
  }
  .side-item{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;border-radius:8px;
    cursor:pointer;color:#C4CCE0;font-size:13.5px;
    transition:background .12s;
  }
  .side-item:hover{background:#101D3E;}
  .side-item.active{background:var(--navy-3);color:#fff;font-weight:500;}
  .hash{color:#5C6A8C;font-size:14px;width:14px;text-align:center;}
  .dm-dot{width:8px;height:8px;border-radius:50%;background:var(--offline);flex-shrink:0;}
  .dm-dot.online{background:var(--online);}
  .unread-pill{
    margin-left:auto;background:var(--blue-2);color:#fff;
    font-size:10.5px;font-weight:600;border-radius:9px;
    padding:1px 6px;min-width:16px;text-align:center;
  }
  .side-footer{
    padding:12px 16px;border-top:1px solid #16234A;
    display:flex;align-items:center;gap:10px;
  }
  .footer-profile{
    display:flex;align-items:center;gap:10px;
    cursor:pointer;border-radius:8px;padding:4px;margin:-4px;
    transition:background .12s;flex:1;min-width:0;
  }
  .footer-profile:hover{background:#101D3E;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(6,14,31,.55);
    display:flex;align-items:center;justify-content:center;z-index:100;
  }
  .modal-card{
    background:#fff;border-radius:16px;width:380px;max-width:90vw;
    max-height:85vh;overflow-y:auto;
  }
  .modal-header{
    padding:18px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }
  .modal-header h3{font-family:'Outfit',sans-serif;font-weight:600;font-size:16px;}
  .modal-close{
    background:none;border:none;font-size:22px;color:var(--muted);
    cursor:pointer;line-height:1;
  }
  .modal-body{padding:20px;}
  .modal-body label{
    display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink);
  }
  .modal-body label:not(:first-child){margin-top:14px;}
  .modal-body input{
    width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:9px;font-family:'DM Sans',sans-serif;font-size:14px;
    background:#FAFBFD;outline:none;
  }
  .modal-body input:focus{border-color:var(--blue-2);background:#fff;}
  .pw-wrap-inline{position:relative;}
  .pw-toggle-inline{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;
  }
  .modal-btn{
    margin-top:12px;padding:10px 16px;border:none;border-radius:9px;
    background:linear-gradient(135deg,var(--blue-2),var(--blue-1));color:#fff;
    font-family:'DM Sans',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;
  }
  .modal-btn:disabled{opacity:.6;cursor:default;}
  .modal-msg{margin-top:10px;font-size:12.5px;display:none;padding:8px 10px;border-radius:7px;}
  .modal-msg.ok{background:#E9F7EF;color:#1D7A44;display:block;}
  .modal-msg.err{background:#FDEDED;color:var(--danger, #D64545);display:block;}
  .modal-divider{height:1px;background:var(--line);margin:20px 0;}
  .avatar{
    width:30px;height:30px;border-radius:50%;
    background:linear-gradient(135deg,var(--blue-2),var(--blue-1));
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;color:#fff;flex-shrink:0;
  }
  .me-name{font-size:13px;font-weight:500;color:#fff;}
  .me-status{font-size:11px;color:var(--online);}
  .logout-btn{
    margin-left:auto;background:none;border:none;color:#5C6A8C;
    cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;
  }

  /* Main thread */
  #main{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0;}
  #thread-header{
    padding:16px 24px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;
  }
  #thread-title{font-family:'Outfit',sans-serif;font-weight:600;font-size:16px;}
  #thread-sub-row{display:flex;align-items:center;gap:6px;margin-top:1px;}
  #thread-sub{font-size:12.5px;color:var(--muted);}
  .typing-indicator{
    display:none;align-items:center;gap:6px;
    padding:4px 24px 0;font-size:12px;color:var(--muted);
  }
  .typing-dots{display:inline-flex;gap:3px;}
  .typing-dots span{
    width:5px;height:5px;border-radius:50%;background:var(--muted);
    animation:typingBounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){animation-delay:.2s;}
  .typing-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes typingBounce{
    0%,60%,100%{transform:translateY(0);opacity:.5;}
    30%{transform:translateY(-4px);opacity:1;}
  }
  #messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:2px;}
  .msg-row{display:flex;gap:12px;padding:8px 4px;border-radius:8px;}
  .msg-row:hover{background:#EEF1F7;}
  .msg-avatar{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,var(--blue-2),var(--blue-1));
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:600;color:#fff;
  }
  .msg-body-wrap{min-width:0;}
  .msg-meta{display:flex;align-items:baseline;gap:8px;}
  .msg-sender{font-weight:600;font-size:13.5px;}
  .msg-time{font-size:11px;color:var(--muted);}
  .msg-text{font-size:14px;line-height:1.55;color:var(--ink);margin-top:1px;word-break:break-word;}
  .msg-text a.case-link{
    color:var(--blue-1);font-weight:600;text-decoration:none;
    border-bottom:1px dashed var(--blue-2);
  }
  .mention-highlight{
    color:var(--blue-1);font-weight:600;background:#EAF2FC;
    border-radius:4px;padding:0 3px;
  }
  #empty-state{
    flex:1;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13.5px;text-align:center;padding:40px;
  }
  #composer{
    padding:16px 24px 20px;background:#fff;border-top:1px solid var(--line);
    position:relative;
  }
  .mention-dropdown{
    display:none;position:absolute;bottom:74px;left:24px;
    background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 8px 24px rgba(11,23,48,.14);
    max-height:190px;overflow-y:auto;width:230px;z-index:20;
  }
  .mention-item{
    padding:8px 12px;cursor:pointer;font-size:13.5px;
    display:flex;align-items:center;gap:8px;
  }
  .mention-item:hover{background:#F0F4FA;}
  .mention-item .mi-avatar{
    width:22px;height:22px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,var(--blue-2),var(--blue-1));
    display:flex;align-items:center;justify-content:center;
    font-size:9.5px;font-weight:600;color:#fff;
  }
  .mention-item .mi-username{color:var(--muted);font-size:12px;}
  #composer-inner{
    display:flex;align-items:flex-end;gap:10px;
    border:1px solid var(--line);border-radius:12px;
    padding:8px 10px;background:#FAFBFD;
  }
  #msgInput{
    flex:1;border:none;background:transparent;outline:none;
    resize:none;font-family:'DM Sans',sans-serif;font-size:14px;
    max-height:120px;padding:6px 4px;line-height:1.5;
  }
  #sendBtn{
    background:linear-gradient(135deg,var(--blue-2),var(--blue-1));
    border:none;color:#fff;border-radius:8px;
    width:34px;height:34px;flex-shrink:0;cursor:pointer;
    font-size:15px;display:flex;align-items:center;justify-content:center;
  }
  #sendBtn:disabled{opacity:.5;cursor:default;}

  /* Icons */
  .icon{width:16px;height:16px;display:inline-block;vertical-align:-3px;}
  .icon-sm{width:13px;height:13px;vertical-align:-2px;}

  /* Sidebar section headers with a create button */
  .side-section-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 10px 6px;
  }
  .side-section-row .side-section{padding:0;}
  .section-add-btn{
    background:none;border:none;color:#5C6A8C;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:5px;
  }
  .section-add-btn:hover{background:#16234A;color:#fff;}

  /* Sidebar search */
  .sidebar-search{
    margin:0 10px 10px;padding:8px 10px;
    background:#0C1A38;border-radius:8px;
    display:flex;align-items:center;gap:8px;cursor:pointer;
    color:#7C87A6;font-size:13px;
  }
  .sidebar-search:hover{background:#101D3E;}

  /* Load older messages */
  .load-older{
    text-align:center;padding:8px;margin-bottom:6px;
    font-size:12.5px;color:var(--blue-1);cursor:pointer;font-weight:600;
  }
  .load-older:hover{text-decoration:underline;}

  /* Search results modal */
  .search-result{
    padding:10px 14px;cursor:pointer;border-bottom:1px solid #F0F2F6;
  }
  .search-result:hover{background:#F5F7FB;}
  .search-result .sr-meta{font-size:11.5px;color:var(--muted);margin-bottom:2px;}
  .search-result .sr-body{font-size:13.5px;color:var(--ink);}
  .search-result .sr-body mark{background:#FFEDB8;border-radius:2px;}
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div class="side-header">
      <img class="mark" src="gca_logo.png" alt="GCA">
      <div class="name">GCA Chat</div>
    </div>
    <div class="side-scroll">
      <div class="sidebar-search" id="sidebarSearchBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Search messages</span>
      </div>
      <div class="side-section-row">
        <div class="side-section">Channels</div>
        <button class="section-add-btn" id="createChannelBtn" title="Create channel" style="display:none;">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>
      <div id="channelList"></div>
      <div class="side-section">Direct messages</div>
      <div id="dmList"></div>
      <div id="adminLinkWrap" style="display:none;">
        <div class="side-section">Admin</div>
        <div class="side-item" onclick="window.location.href='chat-admin.html'">
          <svg class="icon-sm hash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span>Manage agents</span>
        </div>
      </div>
    </div>
    <div class="side-footer">
      <div class="footer-profile" id="footerProfile">
        <div class="avatar" id="meAvatar">--</div>
        <div>
          <div class="me-name" id="meName">Loading…</div>
          <div class="me-status">Online</div>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <div id="accountModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Account settings</h3>
        <button class="modal-close" id="accountModalClose">&times;</button>
      </div>
      <div class="modal-body">
        <label>First name</label>
        <input type="text" id="accFirstName">
        <label>Last name</label>
        <input type="text" id="accLastName">
        <button class="modal-btn" id="saveNameBtn">Save name</button>
        <div class="modal-msg" id="nameMsg"></div>

        <div class="modal-divider"></div>

        <label>New password</label>
        <div class="pw-wrap-inline">
          <input type="password" id="accNewPassword" placeholder="Leave blank to keep current password">
          <button type="button" class="pw-toggle-inline" id="accPwToggle">Show</button>
        </div>
        <button class="modal-btn" id="savePasswordBtn">Update password</button>
        <div class="modal-msg" id="passwordMsg"></div>
      </div>
    </div>
  </div>

  <div id="createChannelModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Create channel</h3>
        <button class="modal-close" id="createChannelModalClose">&times;</button>
      </div>
      <div class="modal-body">
        <label>Channel name</label>
        <input type="text" id="newChannelName" placeholder="e.g. announcements">
        <label>Description (optional)</label>
        <input type="text" id="newChannelDesc" placeholder="What's this channel for?">
        <button class="modal-btn" id="createChannelSaveBtn">Create channel</button>
        <div class="modal-msg" id="createChannelMsg"></div>
      </div>
    </div>
  </div>

  <div id="searchModal" class="modal-overlay" style="display:none;">
    <div class="modal-card" style="width:480px;">
      <div class="modal-header">
        <h3>Search messages</h3>
        <button class="modal-close" id="searchModalClose">&times;</button>
      </div>
      <div class="modal-body" style="padding-bottom:8px;">
        <input type="text" id="searchInput" placeholder="Search across everything you can see…">
      </div>
      <div id="searchResults"></div>
    </div>
  </div>

  <div id="main">
    <div id="thread-header">
      <div>
        <div id="thread-title">Select a channel</div>
        <div id="thread-sub-row">
          <span id="threadStatusDot" class="dm-dot" style="display:none;"></span>
          <span id="thread-sub"></span>
        </div>
      </div>
    </div>
    <div id="loadOlderWrap"></div>
    <div id="messages"></div>
    <div id="empty-state" style="display:none;">Pick a channel or DM on the left to start chatting.</div>
    <div id="typingIndicator" class="typing-indicator">
      <span id="typingText"></span>
      <span class="typing-dots"><span></span><span></span><span></span></span>
    </div>
    <div id="composer">
      <div id="mentionDropdown" class="mention-dropdown"></div>
      <div id="composer-inner">
        <textarea id="msgInput" rows="1" placeholder="Message…" disabled></textarea>
        <button id="sendBtn" disabled>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// ---- Fill these in with YOUR chat app's own Supabase project ----
const SUPABASE_URL = 'https://cuaayxiqpxgsrymqfnnr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1YWF5eGlxcHhnc3J5bXFmbm5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDUzMjgsImV4cCI6MjEwMjAyMTMyOH0.bX3JGwzqJt78ru_7wUYdhwRUOnhFExoY_gFXTgo24Y8';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null;              // current profile row
let allProfiles = [];       // every agent's profile
let channels = [];          // channels I'm a member of (is_dm = false)
let dms = [];                // DM channels I'm a member of
let activeChannelId = null;
let messageSub = null;
let unreadCounts = {};       // channelId -> number of unread messages
let lastReadMap = {};        // channelId -> ISO timestamp I last read it
let dmChannelByProfile = {}; // profileId -> their DM channel id with me
let activeDmProfileId = null; // profile id of who I'm currently DMing, if any
let typingChannelRef = null;
let lastTypingSentAt = 0;
let remoteTypingTimeout = null;

const channelListEl = document.getElementById('channelList');
const dmListEl = document.getElementById('dmList');
const messagesEl = document.getElementById('messages');
const emptyStateEl = document.getElementById('empty-state');
const threadTitleEl = document.getElementById('thread-title');
const threadSubEl = document.getElementById('thread-sub');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

function initials(first, last){
  return ((first||'?')[0] + (last||'?')[0]).toUpperCase();
}

async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session){ window.location.href = 'index.html'; return; }

  const { data: profile } = await supabaseClient
    .from('profiles').select('*').eq('id', session.user.id).single();
  if (!profile){ window.location.href = 'index.html'; return; }
  me = profile;

  document.getElementById('meName').textContent = me.first_name + ' ' + me.last_name;
  document.getElementById('meAvatar').textContent = initials(me.first_name, me.last_name);
  if (me.role === 'admin'){
    document.getElementById('adminLinkWrap').style.display = 'block';
    document.getElementById('createChannelBtn').style.display = 'flex';
  }

  await ensureGeneralChannel();

  const { data: allP } = await supabaseClient.from('profiles').select('*');
  allProfiles = allP || [];

  await loadMyChannels();
  await loadUnreadCounts();
  renderSidebar();
  subscribeToPresenceAndMembership();
  subscribeToAllMessagesForUnread();

  if (me.role !== 'admin'){
    startWorkingHoursWatch();
  }
}

// Force-logs out agents (not admins) once past the working-hours cutoff,
// checked against the database server clock rather than the device's own
// clock. Checks every minute so it catches sessions left open overnight.
function startWorkingHoursWatch(){
  const CUTOFF_MINUTES = 19 * 60 + 15; // 7:15 PM
  setInterval(async () => {
    const { data: serverNow } = await supabaseClient.rpc('get_server_time');
    if (!serverNow) return;
    const now = new Date(serverNow);
    const minutesNow = now.getHours() * 60 + now.getMinutes();
    if (minutesNow >= CUTOFF_MINUTES){
      await supabaseClient.from('profiles').update({ status: 'offline' }).eq('id', me.id);
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html?sessionEnded=1';
    }
  }, 60000);
}

// Auto-join every agent to a shared "General" channel on first login.
// Done as one atomic server-side step (see fix-atomic-channel-creation.sql)
// so there's no gap where the channel exists but membership doesn't yet.
async function ensureGeneralChannel(){
  await supabaseClient.rpc('ensure_general_channel');
}

async function loadMyChannels(){
  const { data: memberships } = await supabaseClient
    .from('channel_members').select('channel_id, last_read_at').eq('profile_id', me.id);
  lastReadMap = {};
  (memberships || []).forEach(m => { lastReadMap[m.channel_id] = m.last_read_at; });
  const ids = (memberships || []).map(m => m.channel_id);
  if (ids.length === 0) return;

  const { data: chans } = await supabaseClient
    .from('channels').select('*').in('id', ids);

  channels = (chans || []).filter(c => !c.is_dm);
  dms = (chans || []).filter(c => c.is_dm);

  dmChannelByProfile = {};
  if (dms.length){
    const dmIds = dms.map(d => d.id);
    const { data: allMembers } = await supabaseClient
      .from('channel_members').select('channel_id, profile_id').in('channel_id', dmIds);
    (allMembers || []).forEach(row => {
      if (row.profile_id !== me.id){
        dmChannelByProfile[row.profile_id] = row.channel_id;
      }
    });
  }
}

async function loadUnreadCounts(){
  const allIds = [...channels.map(c => c.id), ...dms.map(d => d.id)];
  for (const id of allIds){
    const lastRead = lastReadMap[id] || '1970-01-01T00:00:00Z';
    const { count } = await supabaseClient
      .from('messages')
      .select('*', { count: 'exact', head: true })
      .eq('channel_id', id)
      .gt('created_at', lastRead)
      .neq('sender_id', me.id);
    unreadCounts[id] = count || 0;
  }
}

async function markChannelRead(channelId){
  unreadCounts[channelId] = 0;
  const now = new Date().toISOString();
  lastReadMap[channelId] = now;
  renderSidebar();
  await supabaseClient
    .from('channel_members')
    .update({ last_read_at: now })
    .eq('channel_id', channelId)
    .eq('profile_id', me.id);
}

function subscribeToAllMessagesForUnread(){
  supabaseClient
    .channel('all-messages-unread')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      const msg = payload.new;
      if (msg.sender_id === me.id) return;
      if (msg.channel_id === activeChannelId) return;
      unreadCounts[msg.channel_id] = (unreadCounts[msg.channel_id] || 0) + 1;
      renderSidebar();
    })
    .subscribe();
}

function renderSidebar(){
  channelListEl.innerHTML = '';
  channels.forEach(c => {
    const div = document.createElement('div');
    div.className = 'side-item' + (c.id === activeChannelId ? ' active' : '');
    const count = unreadCounts[c.id] || 0;
    div.innerHTML =
      '<span class="hash">#</span><span>' + c.name + '</span>' +
      (count > 0 ? '<span class="unread-pill">' + count + '</span>' : '');
    div.onclick = () => openChannel(c);
    channelListEl.appendChild(div);
  });

  dmListEl.innerHTML = '';
  const others = allProfiles.filter(p => p.id !== me.id);
  others.forEach(p => {
    const div = document.createElement('div');
    const dmId = dmChannelByProfile[p.id];
    div.className = 'side-item' + (dmId && dmId === activeChannelId ? ' active' : '');
    const online = p.status === 'online';
    const count = dmId ? (unreadCounts[dmId] || 0) : 0;
    div.innerHTML =
      '<span class="dm-dot' + (online ? ' online' : '') + '"></span>' +
      '<span>' + p.first_name + ' ' + p.last_name + '</span>' +
      (count > 0 ? '<span class="unread-pill">' + count + '</span>' : '');
    div.onclick = () => openOrCreateDM(p);
    dmListEl.appendChild(div);
  });
}

async function openChannel(channel){
  activeChannelId = channel.id;
  activeDmProfileId = null;
  threadTitleEl.textContent = '# ' + channel.name;
  threadSubEl.textContent = channel.description || '';
  document.getElementById('threadStatusDot').style.display = 'none';
  hideTypingIndicator();
  emptyStateEl.style.display = 'none';
  msgInput.disabled = false;
  sendBtn.disabled = false;
  await markChannelRead(channel.id);
  renderSidebar();
  await loadMessages(channel.id);
  listenForNewMessages(channel.id);
  subscribeTypingChannel(channel.id);
}

async function openOrCreateDM(otherProfile){
  // One atomic server-side call: finds an existing DM or creates it + both
  // memberships together, so there's never a moment where the channel
  // exists but you're not a recognized member of it yet.
  const { data: channelId, error } = await supabaseClient
    .rpc('create_dm_channel', { _other_profile_id: otherProfile.id });

  if (error || !channelId){
    console.error('Could not open DM:', error);
    return;
  }

  let dmChannel = dms.find(d => d.id === channelId);
  if (!dmChannel){
    const { data: fetched } = await supabaseClient
      .from('channels').select('*').eq('id', channelId).single();
    dmChannel = fetched;
    if (dmChannel) dms.push(dmChannel);
  }
  if (!dmChannel) return;

  activeChannelId = dmChannel.id;
  activeDmProfileId = otherProfile.id;
  dmChannelByProfile[otherProfile.id] = dmChannel.id;
  threadTitleEl.textContent = otherProfile.first_name + ' ' + otherProfile.last_name;
  threadSubEl.textContent = otherProfile.status === 'online' ? 'Online' : 'Offline';
  const dotEl = document.getElementById('threadStatusDot');
  dotEl.style.display = 'inline-block';
  dotEl.className = 'dm-dot' + (otherProfile.status === 'online' ? ' online' : '');
  hideTypingIndicator();
  emptyStateEl.style.display = 'none';
  msgInput.disabled = false;
  sendBtn.disabled = false;
  await markChannelRead(dmChannel.id);
  renderSidebar();
  await loadMessages(dmChannel.id);
  listenForNewMessages(dmChannel.id);
  subscribeTypingChannel(dmChannel.id);
}

const PAGE_SIZE = 50;
let oldestLoadedAt = null;

async function loadMessages(channelId){
  messagesEl.innerHTML = '';
  document.getElementById('loadOlderWrap').innerHTML = '';
  const { data: msgs } = await supabaseClient
    .from('messages').select('*').eq('channel_id', channelId)
    .order('created_at', { ascending: false }).limit(PAGE_SIZE);
  const ordered = (msgs || []).slice().reverse();
  oldestLoadedAt = ordered.length ? ordered[0].created_at : null;
  ordered.forEach(renderMessage);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  renderLoadOlderControl(channelId, ordered.length === PAGE_SIZE);
}

function renderLoadOlderControl(channelId, mayHaveMore){
  const wrap = document.getElementById('loadOlderWrap');
  if (!mayHaveMore){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = '<div class="load-older" id="loadOlderBtn">Load older messages</div>';
  document.getElementById('loadOlderBtn').onclick = () => loadOlderMessages(channelId);
}

async function loadOlderMessages(channelId){
  if (!oldestLoadedAt) return;
  const btn = document.getElementById('loadOlderBtn');
  if (btn) btn.textContent = 'Loading…';

  const { data: older } = await supabaseClient
    .from('messages').select('*').eq('channel_id', channelId)
    .lt('created_at', oldestLoadedAt)
    .order('created_at', { ascending: false }).limit(PAGE_SIZE);
  const ordered = (older || []).slice().reverse();

  if (!ordered.length){
    document.getElementById('loadOlderWrap').innerHTML = '';
    return;
  }
  oldestLoadedAt = ordered[0].created_at;

  const prevScrollHeight = messagesEl.scrollHeight;
  const firstRow = messagesEl.firstChild;
  ordered.forEach(msg => {
    const row = buildMessageRow(msg);
    messagesEl.insertBefore(row, firstRow);
  });
  messagesEl.scrollTop = messagesEl.scrollHeight - prevScrollHeight;

  renderLoadOlderControl(channelId, ordered.length === PAGE_SIZE);
}

function renderMessage(msg){
  const row = buildMessageRow(msg);
  messagesEl.appendChild(row);
}

function buildMessageRow(msg){
  const sender = allProfiles.find(p => p.id === msg.sender_id);
  const senderName = sender ? (sender.first_name + ' ' + sender.last_name) : 'Deleted agent';
  const senderInitials = sender ? initials(sender.first_name, sender.last_name) : '?';
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.dataset.messageId = msg.id;
  const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const escaped = msg.body
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const linked = linkifyCaseIds(escaped);
  const withMentions = linkifyMentions(linked);
  row.innerHTML =
    '<div class="msg-avatar">' + senderInitials + '</div>' +
    '<div class="msg-body-wrap">' +
      '<div class="msg-meta"><span class="msg-sender">' + senderName + '</span>' +
      '<span class="msg-time">' + time + '</span></div>' +
      '<div class="msg-text">' + withMentions + '</div>' +
    '</div>';
  return row;
}

function linkifyCaseIds(text){
  return text.replace(/#([A-Za-z0-9\-]+)/g, '<a class="case-link" href="#">#$1</a>');
}

function linkifyMentions(text){
  let out = text;
  allProfiles.forEach(p => {
    if (!p.username) return;
    const safe = p.username.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('@' + safe + '\\b', 'gi');
    out = out.replace(re, '<span class="mention-highlight">@' + p.username + '</span>');
  });
  return out;
}

function listenForNewMessages(channelId){
  if (messageSub) supabaseClient.removeChannel(messageSub);
  messageSub = supabaseClient
    .channel('room-' + channelId)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages', filter: 'channel_id=eq.' + channelId },
      payload => {
        renderMessage(payload.new);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      })
    .subscribe();
}

function subscribeToPresenceAndMembership(){
  supabaseClient
    .channel('profiles-presence')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' }, payload => {
      const idx = allProfiles.findIndex(p => p.id === payload.new.id);
      if (idx > -1) allProfiles[idx] = payload.new;
      renderSidebar();
      if (activeDmProfileId === payload.new.id){
        threadSubEl.textContent = payload.new.status === 'online' ? 'Online' : 'Offline';
        const dotEl = document.getElementById('threadStatusDot');
        dotEl.className = 'dm-dot' + (payload.new.status === 'online' ? ' online' : '');
      }
    })
    .subscribe();
}

function subscribeTypingChannel(channelId){
  if (typingChannelRef) supabaseClient.removeChannel(typingChannelRef);
  typingChannelRef = supabaseClient
    .channel('typing-' + channelId)
    .on('broadcast', { event: 'typing' }, payload => {
      if (payload.payload.profile_id === me.id) return;
      showTypingIndicator(payload.payload.name);
    })
    .subscribe();
}

function showTypingIndicator(name){
  document.getElementById('typingText').textContent = name + ' is typing';
  document.getElementById('typingIndicator').style.display = 'flex';
  clearTimeout(remoteTypingTimeout);
  remoteTypingTimeout = setTimeout(hideTypingIndicator, 3000);
}

function hideTypingIndicator(){
  document.getElementById('typingIndicator').style.display = 'none';
  clearTimeout(remoteTypingTimeout);
}

function broadcastTyping(){
  if (!typingChannelRef || !activeChannelId) return;
  const now = Date.now();
  if (now - lastTypingSentAt < 2000) return;
  lastTypingSentAt = now;
  typingChannelRef.send({
    type: 'broadcast',
    event: 'typing',
    payload: { profile_id: me.id, name: me.first_name }
  });
}

async function sendMessage(){
  const text = msgInput.value.trim();
  if (!text || !activeChannelId) return;
  msgInput.value = '';
  msgInput.style.height = 'auto';
  mentionDropdownEl.style.display = 'none';
  await supabaseClient.from('messages').insert({
    channel_id: activeChannelId,
    sender_id: me.id,
    body: text
  });
}

const mentionDropdownEl = document.getElementById('mentionDropdown');

function getMentionRange(){
  const pos = msgInput.selectionStart;
  const text = msgInput.value;
  const upToCursor = text.slice(0, pos);
  const match = upToCursor.match(/(^|\s)@([A-Za-z0-9._-]*)$/);
  if (!match) return null;
  const query = match[2];
  const start = pos - query.length - 1;
  return { start, end: pos, query };
}

function updateMentionDropdown(){
  const range = getMentionRange();
  if (!range){ mentionDropdownEl.style.display = 'none'; return; }
  const q = range.query.toLowerCase();
  const matches = allProfiles.filter(p =>
    p.id !== me.id && p.username &&
    (p.username.toLowerCase().startsWith(q) ||
     (p.first_name + ' ' + p.last_name).toLowerCase().startsWith(q))
  ).slice(0, 6);

  if (!matches.length){ mentionDropdownEl.style.display = 'none'; return; }

  mentionDropdownEl.innerHTML = matches.map(p =>
    '<div class="mention-item" data-username="' + p.username + '">' +
      '<div class="mi-avatar">' + initials(p.first_name, p.last_name) + '</div>' +
      '<span>' + p.first_name + ' ' + p.last_name + ' <span class="mi-username">@' + p.username + '</span></span>' +
    '</div>').join('');
  mentionDropdownEl.style.display = 'block';
  mentionDropdownEl.querySelectorAll('.mention-item').forEach(item => {
    item.onclick = () => insertMention(item.dataset.username);
  });
}

function insertMention(username){
  const range = getMentionRange();
  if (!range) return;
  const text = msgInput.value;
  const before = text.slice(0, range.start);
  const after = text.slice(range.end);
  const insertText = '@' + username + ' ';
  msgInput.value = before + insertText + after;
  const newPos = (before + insertText).length;
  mentionDropdownEl.style.display = 'none';
  msgInput.focus();
  msgInput.setSelectionRange(newPos, newPos);
}

msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  updateMentionDropdown();
  broadcastTyping();
});
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ mentionDropdownEl.style.display = 'none'; return; }
  if (e.key === 'Enter' && !e.shiftKey && mentionDropdownEl.style.display !== 'block'){
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);

document.getElementById('footerProfile').addEventListener('click', () => {

  document.getElementById('accNewPassword').value = '';

});

});

document.getElementById('saveNameBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveNameBtn');
  const msg = document.getElementById('nameMsg');
  const firstName = document.getElementById('accFirstName').value.trim();
  const lastName = document.getElementById('accLastName').value.trim();

  btn.disabled = true;
  const { error } = await supabaseClient
    .from('profiles')
    .update({ first_name: firstName, last_name: lastName })

  if (error){
    msg.textContent = error.message;
    msg.className = 'modal-msg err';
  } else {
    me.first_name = firstName;
    me.last_name = lastName;
    document.getElementById('meName').textContent = firstName + ' ' + lastName;
    document.getElementById('meAvatar').textContent = initials(firstName, lastName);
    msg.textContent = 'Name updated.';
    msg.className = 'modal-msg ok';
  }
});

document.getElementById('savePasswordBtn').addEventListener('click', async () => {
  const btn = document.getElementById('savePasswordBtn');
  const msg = document.getElementById('passwordMsg');
  const newPassword = document.getElementById('accNewPassword').value;
  if (!newPassword || newPassword.length < 6){
    msg.textContent = 'Password must be at least 6 characters.';
    msg.className = 'modal-msg err';
    return;
  }

  btn.disabled = true;
  const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
  btn.disabled = false;

  if (error){
    msg.textContent = error.message;
    msg.className = 'modal-msg err';
  } else {
    document.getElementById('accNewPassword').value = '';
    msg.textContent = 'Password updated.';
    msg.className = 'modal-msg ok';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  if (me){
    await supabaseClient.from('profiles').update({ status: 'offline' }).eq('id', me.id);
  }
  await supabaseClient.auth.signOut();
  window.location.href = 'index.html';
});

  if (me) navigator.sendBeacon
    ? null
    : supabaseClient.from('profiles').update({ status: 'offline' }).eq('id', me.id);
});

document.getElementById('searchModalClose').addEventListener('click', () => {

let searchDebounce = null;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  const q = e.target.value.trim();
  if (q.length < 2){
    document.getElementById('searchResults').innerHTML = '';
    return;
  }
  searchDebounce = setTimeout(() => runSearch(q), 300);
});

function escapeHtml(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function channelLabel(channelId){
  const chan = channels.find(c => c.id === channelId);
  if (chan) return '#' + chan.name;
  const dmProfileId = Object.keys(dmChannelByProfile).find(pid => dmChannelByProfile[pid] === channelId);
  const person = dmProfileId ? allProfiles.find(p => p.id === dmProfileId) : null;
  return person ? ('DM with ' + person.first_name + ' ' + person.last_name) : 'Direct message';
}

async function runSearch(query){
  const allIds = [...channels.map(c => c.id), ...dms.map(d => d.id)];
  if (!allIds.length) return;

  const { data: results } = await supabaseClient
    .from('messages')
    .select('*')
    .in('channel_id', allIds)
    .ilike('body', '%' + query + '%')
    .order('created_at', { ascending: false })
    .limit(30);

  const resultsEl = document.getElementById('searchResults');
  if (!results || !results.length){
    resultsEl.innerHTML = '<div class="search-result" style="color:var(--muted);cursor:default;">No messages found.</div>';
    return;
  }

  const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const highlightRe = new RegExp('(' + escapedQuery + ')', 'gi');

  resultsEl.innerHTML = results.map(r => {
    const sender = allProfiles.find(p => p.id === r.sender_id);
    const senderName = sender ? sender.first_name + ' ' + sender.last_name : 'Deleted agent';
    const time = new Date(r.created_at).toLocaleDateString([], { day: 'numeric', month: 'short' });
    const bodyEscaped = escapeHtml(r.body).replace(highlightRe, '<mark>$1</mark>');
    return '<div class="search-result" data-channel-id="' + r.channel_id + '" data-message-id="' + r.id + '">' +
      '<div class="sr-meta">' + channelLabel(r.channel_id) + ' \u00b7 ' + senderName + ' \u00b7 ' + time + '</div>' +
      '<div class="sr-body">' + bodyEscaped + '</div>' +
    '</div>';
  }).join('');

  resultsEl.querySelectorAll('.search-result[data-channel-id]').forEach(el => {
    el.onclick = () => jumpToSearchResult(el.dataset.channelId, el.dataset.messageId);
  });
}

async function jumpToSearchResult(channelId, messageId){
  document.getElementById('searchModal').style.display = 'none';

  const chan = channels.find(c => c.id === channelId);
  if (chan){
    await openChannel(chan);
  } else {
    const dmProfileId = Object.keys(dmChannelByProfile).find(pid => dmChannelByProfile[pid] === channelId);
    const person = dmProfileId ? allProfiles.find(p => p.id === dmProfileId) : null;
    if (person) await openOrCreateDM(person);
  }

  setTimeout(() => {
    const row = messagesEl.querySelector('[data-message-id="' + messageId + '"]');
    if (row){
      row.scrollIntoView({ block: 'center' });
      row.style.background = '#FFF3CD';
      setTimeout(() => { row.style.background = ''; }, 1800);
    }
  }, 300);
}
