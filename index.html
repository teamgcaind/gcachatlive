<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCA Chat — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#060E1F;
    --navy-2:#0B1730;
    --blue-1:#1349A0;
    --blue-2:#2B8AE8;
    --ink:#0B1730;
    --muted:#6B7688;
    --line:#E3E7EF;
    --danger:#D64545;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'DM Sans',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--navy);
    background-image:radial-gradient(circle at 20% -10%, #12275C 0%, var(--navy) 55%);
    color:#fff;
  }
  .login-wrap{
    display:flex;
    width:100%;
    max-width:980px;
    min-height:600px;
    box-shadow:0 30px 80px rgba(0,0,0,.35);
    border-radius:24px;
    overflow:hidden;
  }
  .side{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:64px 72px;
    max-width:520px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:48px;
  }
  .brand .mark{
    width:40px;height:40px;border-radius:10px;
    object-fit:cover;flex-shrink:0;
  }
  .brand .name{font-family:'Outfit',sans-serif;font-weight:600;font-size:17px;letter-spacing:.2px;}
  .brand .sub{font-size:12px;color:#93A0BD;margin-top:2px;}
  h1{
    font-family:'Outfit',sans-serif;
    font-weight:600;
    font-size:34px;
    line-height:1.25;
    letter-spacing:-.3px;
    max-width:400px;
  }
  .tagline{
    margin-top:14px;
    color:#93A0BD;
    font-size:15px;
    line-height:1.6;
    max-width:380px;
  }
  .rail{
    display:flex;
    gap:10px;
    margin-top:44px;
  }
  .rail .dot{
    width:6px;height:6px;border-radius:50%;
    background:#2C4270;
  }
  .rail .dot.on{background:var(--blue-2);}
  .panel{
    flex:1;
    max-width:460px;
    background:#fff;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:56px;
    border-radius:24px 0 0 24px;
  }
  .panel h2{font-family:'Outfit',sans-serif;font-weight:600;font-size:22px;margin-bottom:6px;}
  .panel .hint{color:var(--muted);font-size:13.5px;margin-bottom:32px;}
  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
    margin-top:18px;
  }
  label:first-of-type{margin-top:0;}
  input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    font-family:'DM Sans',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    background:#FAFBFD;
    outline:none;
    transition:border-color .15s;
  }
  input:focus{border-color:var(--blue-2);background:#fff;}
  .pw-wrap{position:relative;}
  .pw-toggle{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--muted);font-size:12.5px;
    cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;
  }
  button.submit{
    margin-top:26px;
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,var(--blue-2),var(--blue-1));
    color:#fff;
    font-family:'DM Sans',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    transition:opacity .15s;
  }
  button.submit:disabled{opacity:.6;cursor:default;}
  .error{
    display:none;
    margin-top:16px;
    padding:11px 13px;
    background:#FDEDED;
    border:1px solid #F5C6C6;
    border-radius:8px;
    color:var(--danger);
    font-size:13px;
    line-height:1.5;
  }
  @media(max-width:820px){
    .login-wrap{flex-direction:column;max-width:460px;}
    .side{max-width:100%;padding:40px 28px 20px;}
    .panel{max-width:100%;border-radius:24px 24px 0 0;padding:36px 28px;}
    h1{font-size:26px;}
  }
</style>
</head>
<body>

<div class="login-wrap">
<div class="side">
  <div class="brand">
    <img class="mark" src="gca_logo.png" alt="GCA">
    <div>
      <div class="name">GCA Chat</div>
      <div class="sub">Internal team communication</div>
    </div>
  </div>
  <h1>Everything the team says, in one place.</h1>
  <p class="tagline">Channels for the whole team, direct messages for quick questions, all live.</p>
  <div class="rail">
    <div class="dot on"></div><div class="dot on"></div><div class="dot on"></div><div class="dot"></div><div class="dot"></div>
  </div>
</div>

<div class="panel">
  <h2>Sign in</h2>
  <p class="hint">Use the username your admin gave you.</p>

  <form id="loginForm">
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" required>

    <label for="password">Password</label>
    <div class="pw-wrap">
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="button" class="pw-toggle" id="pwToggle">Show</button>
    </div>

    <button type="submit" class="submit" id="submitBtn">Sign in</button>
    <div class="error" id="errorBox"></div>
  </form>
</div>
</div>

<script>
// ---- Fill these in with YOUR chat app's own Supabase project (separate from any CRM project) ----
const SUPABASE_URL = 'https://cuaayxiqpxgsrymqfnnr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1YWF5eGlxcHhnc3J5bXFmbm5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDUzMjgsImV4cCI6MjEwMjAyMTMyOH0.bX3JGwzqJt78ru_7wUYdhwRUOnhFExoY_gFXTgo24Y8';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const pwInput = document.getElementById('password');
const pwToggle = document.getElementById('pwToggle');
pwToggle.addEventListener('click', () => {
  const isPw = pwInput.type === 'password';
  pwInput.type = isPw ? 'text' : 'password';
  pwToggle.textContent = isPw ? 'Hide' : 'Show';
});

const form = document.getElementById('loginForm');
const errorBox = document.getElementById('errorBox');
const submitBtn = document.getElementById('submitBtn');

function showError(msg){
  errorBox.textContent = msg;
  errorBox.style.display = 'block';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Signing in…';

  const username = document.getElementById('username').value.trim();
  const password = pwInput.value;
  const fakeEmail = username.toLowerCase() + '@gcachat.internal';

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: fakeEmail,
      password
    });
    if (error) throw error;

    await supabaseClient
      .from('profiles')
      .update({ status: 'online', last_seen: new Date().toISOString() })
      .eq('id', data.user.id);

    window.location.href = 'chat-app.html';
  } catch (err) {
    showError(err.message === 'Invalid login credentials'
      ? 'Wrong username or password.'
      : 'Could not sign in: ' + err.message);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
